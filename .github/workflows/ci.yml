name: CI

on:
  pull_request:
  push:
    branches: [main]

# A.5 removed Docker as a DEVELOPER-MACHINE dependency. GitHub Actions runners
# ship with Docker already, so the `database` job below runs a disposable
# PostgreSQL service container without reintroducing anything for anyone
# working on this project (architecture H.6).
#
# NO SUPABASE CREDENTIAL OF ANY KIND BELONGS IN THIS FILE. The database job
# exists precisely so that grants and RLS can be proven without one. If a
# change appears to need a Supabase key here, that is the signal to re-read
# H.6, not to add the secret.
jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can inspect every commit, not just
          # the tip. A key committed three commits ago is still a leaked key.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:ci

      # The build runs WITHOUT real credentials, deliberately. Vite does not
      # execute modules while bundling, so the env guard in supabaseClient.js
      # does not fire here (docs/setup.md). Placeholders keep the build
      # honest: if a future change starts requiring real credentials at build
      # time, this step is where we find out.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key

      - name: Scan built output for secrets
        run: npm run scan:dist

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No committed env files
        run: |
          set -euo pipefail
          # .env.example is expected and holds placeholders only.
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$'; then
            echo "::error::A real .env file is tracked. Remove it and rotate anything it held."
            exit 1
          fi
          echo "OK: only .env.example is tracked"

      - name: No secret-shaped strings in tracked files
        run: |
          set -euo pipefail
          # Patterns that must NEVER appear:
          #   sb_secret_        Supabase secret key (new format)
          #   service_role      Supabase service-role key or its JWT role claim
          #   eyJ...            a JWT, which may be a legacy service-role key
          #
          # Exclusions, and why each is legitimate rather than a workaround:
          #   docs/**           the architecture discusses these names at
          #                     length by design. Prose about keys, not keys.
          #   this workflow     it defines the patterns it searches for.
          #   scan-dist.mjs     likewise — it is the dist scanner, so it
          #                     necessarily contains the strings it hunts.
          # Nothing else is excluded; a real secret cannot hide behind these.
          # NOTE on `service_role`: the bare string is a PostgreSQL role name,
          # which supabase/*.sql legitimately writes (bootstrap, parity). The
          # thing that must never appear is a service-role KEY, and a key is
          # either a JWT (eyJ...) or sb_secret_... - both matched below on
          # their own. Matching `service_role_key`-shaped variable names keeps
          # the intent without flagging every GRANT statement. Excluding
          # supabase/** instead would have let a real key hide there.
          EXCLUDE=(-- . ':(exclude)docs/**' ':(exclude).github/workflows/ci.yml'
                   ':(exclude)scripts/scan-dist.mjs')

          # Two greps, because the two pattern families need DIFFERENT case
          # sensitivity and one -i flag would apply to both.
          #
          # (a) Key VALUES - case-SENSITIVE. A JWT always begins with the
          #     literal `eyJ` (base64 of `{"`), so matching it case-
          #     insensitively finds base64 noise instead: `-i` matched an
          #     npm integrity hash in package-lock.json, which is how this
          #     check first failed.
          if git grep -nE '(sb_secret_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]{30,})' "${EXCLUDE[@]}"; then
            echo "::error::Secret-shaped VALUE found in a tracked file. Rotate it."
            exit 1
          fi

          # (b) Key NAMES - case-INsensitive, since a variable may be spelled
          #     any way. The bare role name `service_role` is deliberately NOT
          #     matched: it is a PostgreSQL role that supabase/*.sql writes in
          #     ordinary GRANT statements. A service-role KEY is always one of
          #     the two value shapes above, so nothing is lost by this.
          if git grep -niE 'service[_-]?role[_-]?key[^A-Za-z0-9_-]*[=:]' "${EXCLUDE[@]}"; then
            echo "::error::A service-role key variable appears to be assigned a value."
            exit 1
          fi

          echo "OK: no secret-shaped strings"

      - name: History check
        run: |
          set -euo pipefail
          # A key removed in a later commit is still in the history and still
          # compromised. Deleting it from the working tree is not enough
          # (architecture E.5) - the only correct response is rotation.
          if git log -p --all | grep -nE '(sb_secret_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]{40,})' | head -5; then
            echo "::error::Secret-shaped string found in git history. Rotate the key immediately; removing the file is not sufficient."
            exit 1
          fi
          echo "OK: history clean"

  database:
    name: Database — GRANTs and RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        # PINNED to an exact version (H.6 condition 1, decision O6). Never
        # `latest` and never a tag that moves: the whole value of this job is
        # that a green result means the same thing next month.
        #
        # The Supabase image rather than stock postgres, so extensions and base
        # roles match the platform we deploy to.
        image: supabase/postgres:17.11.0.007
        env:
          # Ephemeral, local to this run, and reachable only from this job.
          # Not a secret in any meaningful sense, and not a Supabase credential.
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      # Fail the step on the FIRST error rather than running on and reporting
      # success at the end. Without this, a broken migration looks like a pass.
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc --quiet

    steps:
      - uses: actions/checkout@v4

      - name: Install psql and pg_prove
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client libtap-parser-sourcehandler-pgtap-perl

      # Diagnostics are emitted as ::notice:: so they are readable from the
      # check-run annotations, not only by downloading the run log. A fact
      # nobody can see gets guessed at instead, which is how the previous two
      # attempts at this job were debugged.
      - name: Report what the pinned image actually provides
        run: |
          set -euo pipefail
          note() { echo "::notice::$1: $(echo "$2" | tr '\n' ' ' | head -c 700)"; }

          note "version"    "$($PSQL -tAc 'select version()')"
          note "extensions" "$($PSQL -tAc "select name || '=' || coalesce(installed_version,'(available)')
                                             from pg_available_extensions
                                            where name in ('pgtap','pgcrypto')")"
          note "current"    "$($PSQL -tAc 'select current_user || \' super=\' || usesuper
                                             from pg_user where usename = current_user')"
          note "schemas"    "$($PSQL -tAc "select nspname || ' owned_by=' || pg_get_userbyid(nspowner)
                                             from pg_namespace
                                            where nspname in ('auth','public','extensions')")"
          note "roles"      "$($PSQL -tAc "select rolname
                                             || ' super='  || rolsuper
                                             || ' login='  || rolcanlogin
                                             || ' member=' || pg_has_role(current_user, rolname, 'MEMBER')
                                             from pg_roles
                                            where rolname like 'supabase%'
                                               or rolname in ('postgres','anon','authenticated','service_role','authenticator')
                                            order by rolname")"
          note "auth_tables" "$($PSQL -tAc "select coalesce(string_agg(tablename, ','), '(none)')
                                              from pg_tables where schemaname = 'auth'")"

      - name: Bootstrap the reconstruction
        run: |
          set -euo pipefail
          for f in supabase/bootstrap/*.sql; do
            echo "-- $f"
            # Capture stderr so the actual psql message reaches the job
            # ANNOTATION, which is readable without downloading the run log.
            if ! err=$($PSQL -f "$f" 2>&1); then
              echo "$err"
              echo "::error file=$f::$(echo "$err" | tr '\n' ' ' | head -c 800)"
              exit 1
            fi
          done

      - name: Apply migrations
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            case "$f" in *.down.sql) continue;; esac
            echo "-- $f"
            if ! err=$($PSQL -f "$f" 2>&1); then
              echo "$err"
              echo "::error file=$f::$(echo "$err" | tr '\n' ' ' | head -c 800)"
              exit 1
            fi
          done

      - name: Run pgTAP
        run: |
          set -euo pipefail
          if ! out=$(pg_prove --verbose supabase/tests/*.sql 2>&1); then
            echo "$out"
            # Surface the failing assertions themselves, not just "exit 1".
            echo "::error::$(echo "$out" | grep -E '^(not ok|#.*(Failed|expected|have|want))' \
                              | head -20 | tr '\n' ' ' | head -c 800)"
            exit 1
          fi
          echo "$out"

      # H.6.1 / plan §8. An untested rollback is a rollback that fails the
      # first time it is needed, which is also the worst possible moment.
      - name: Rehearse the rollback
        run: |
          set -euo pipefail
          $PSQL -f supabase/migrations/0001_profiles_and_roles.down.sql

          remaining=$($PSQL -tAc "select count(*) from pg_tables where schemaname='public'")
          if [ "$remaining" != "0" ]; then
            echo "::error::Rollback left $remaining table(s) in public."
            exit 1
          fi
          echo "OK: rollback returned public to its bootstrap state"

          # Re-apply and re-run: a rollback that cannot be undone is not a
          # rollback, it is a one-way door.
          $PSQL -f supabase/migrations/0001_profiles_and_roles.sql
          pg_prove supabase/tests/*.sql
          echo "OK: re-applied cleanly and the suite still passes"

      - name: Collect the catalogue snapshot for the parity check
        run: |
          set -euo pipefail
          $PSQL -f supabase/parity/collect.sql > parity-ci.txt
          echo "Collected $(wc -l < parity-ci.txt) catalogue lines"

      # The CI half of the H.6.1 diff. The cloud half is produced by the owner
      # from a local shell, because it needs privileged read access that must
      # never enter CI (H.6 condition 6).
      - uses: actions/upload-artifact@v4
        with:
          name: parity-ci
          path: parity-ci.txt
